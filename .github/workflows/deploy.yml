name: Deploy Evaltools

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy (branch, tag or SHA)
        required: false
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: evaltools-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::585768185822:role/EvaltoolsUNextGitHubActionsDeployRole
  # Selected by Project+Role rather than the Name tag: Name gets edited by
  # humans, and Project=Evaltools is also what the deploy role's IAM condition
  # keys on, so anything this resolves to is guaranteed to accept SendCommand.
  INSTANCE_TAG_PROJECT: Evaltools
  INSTANCE_TAG_ROLE: app
  PUBLIC_ENDPOINT: http://3.108.101.12

jobs:
  deploy:
    name: Build and roll out on the EvalTools host
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Nothing is packaged or uploaded here: the host clones this repo itself.
      # This job only tells it which ref to build, over SSM. No SSH, no keys.
      - name: Resolve target instance
        id: target
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$INSTANCE_TAG_PROJECT" \
                      "Name=tag:Role,Values=$INSTANCE_TAG_ROLE" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)

          COUNT=$(echo $INSTANCE_IDS | wc -w)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No running instance tagged Project=$INSTANCE_TAG_PROJECT, Role=$INSTANCE_TAG_ROLE."
            echo "::error::The host is probably stopped. Start it, then re-run this workflow:"
            echo "::error::  aws ec2 start-instances --region $AWS_REGION --instance-ids <id>"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Expected exactly one host, found $COUNT: $INSTANCE_IDS"
            echo "::error::Refusing to guess which one to deploy to."
            exit 1
          fi
          INSTANCE_ID=$INSTANCE_IDS
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Target instance: $INSTANCE_ID"

      - name: Roll out
        run: |
          set -euo pipefail
          # Deploy the exact commit that triggered this run, so two quick pushes
          # cannot race and land the wrong tree.
          REF="${{ github.event.inputs.git_ref || github.sha }}"
          INSTANCE_ID="${{ steps.target.outputs.instance_id }}"
          echo "Deploying ref: $REF"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GHA deploy ${GITHUB_RUN_ID}" \
            --timeout-seconds 900 \
            --parameters "commands=['/opt/evaltools-stack/scripts/deploy.sh $REF'],executionTimeout=['3600']" \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $CMD_ID"

          # Image builds can take a while (torch, spaCy, npm ci) on a cold cache.
          STATUS=Pending
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 15
          done

          echo "----- deploy output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "----- stderr -----"; echo "$ERR"
          fi

          [ "$STATUS" = "Success" ] || { echo "::error::Deploy finished as $STATUS"; exit 1; }

      - name: Verify public routes
        run: |
          set -uo pipefail
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$PUBLIC_ENDPOINT$1" || echo 000)
            if [ "$code" = "200" ]; then
              printf '  ok    %-26s %s\n' "$1" "$code"
            else
              printf '  FAIL  %-26s %s\n' "$1" "$code"; fail=1
            fi
          }
          check /health
          check /
          check /comcoachai
          check /api/comcoachai/health
          check /convai/
          check /api/convai/healthz
          check /evalai/
          check /_stcore/health
          exit $fail
