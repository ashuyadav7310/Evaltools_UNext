name: Deploy Evaltools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: evaltools-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::585768185822:role/EvaltoolsUNextGitHubActionsDeployRole
  ASG_NAME: comcoach-20260624112658-asg
  ALB_DNS: comcoach-alb-20260624112658-911110873.ap-south-1.elb.amazonaws.com
  SSH_USER: ec2-user

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package repository
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*/node_modules' \
            --exclude='*/.next' \
            --exclude='*/venv' \
            --exclude='*/.venv' \
            --exclude='*/__pycache__' \
            --exclude='*/uploads' \
            --exclude='*/reports' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/evaltools-release.tar.gz" \
            ComCoachAI ConvAI EvalAI root-dist

      - name: Deploy release
        run: |
          set -euo pipefail

          mapfile -t INSTANCE_IDS < <(
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'].InstanceId" \
              --output text | tr '\t' '\n' | sed '/^$/d'
          )

          if [ "${#INSTANCE_IDS[@]}" -eq 0 ]; then
            echo "No healthy instances found in ASG: $ASG_NAME"
            exit 1
          fi

          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/eic_key" -q

          for INSTANCE_ID in "${INSTANCE_IDS[@]}"; do
            read -r AZ PUBLIC_IP STATE < <(
              aws ec2 describe-instances \
                --instance-ids "$INSTANCE_ID" \
                --query "Reservations[0].Instances[0].[Placement.AvailabilityZone,PublicIpAddress,State.Name]" \
                --output text
            )

            if [ "$STATE" != "running" ] || [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
              echo "Skipping $INSTANCE_ID: state=$STATE public_ip=$PUBLIC_IP"
              continue
            fi

            echo "Deploying to $INSTANCE_ID at $PUBLIC_IP"

            aws ec2-instance-connect send-ssh-public-key \
              --instance-id "$INSTANCE_ID" \
              --availability-zone "$AZ" \
              --instance-os-user "$SSH_USER" \
              --ssh-public-key "file://$RUNNER_TEMP/eic_key.pub"

            scp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i "$RUNNER_TEMP/eic_key" \
              "$RUNNER_TEMP/evaltools-release.tar.gz" \
              "$SSH_USER@$PUBLIC_IP:/tmp/evaltools-release.tar.gz"

            ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i "$RUNNER_TEMP/eic_key" \
              "$SSH_USER@$PUBLIC_IP" \
              'bash -s' <<'REMOTE'
          set -euo pipefail

          sudo dnf install -y rsync python3.11 python3.11-pip nodejs npm nginx tar gzip

          sudo rm -rf /tmp/evaltools-release
          sudo mkdir -p /tmp/evaltools-release
          sudo tar -xzf /tmp/evaltools-release.tar.gz -C /tmp/evaltools-release

          sudo mkdir -p \
            /opt/comcoach/ComCoachAI \
            /opt/evaltools/ConvAI \
            /opt/evaltools/deploy-new/EvalAI \
            /opt/evaltools/deploy-new/root-dist \
            /var/www/evaltools

          sudo rsync -a --delete \
            --exclude='.env' --exclude='venv/' --exclude='.venv/' \
            --exclude='node_modules/' --exclude='.next/' \
            --exclude='uploads/' --exclude='reports/' \
            /tmp/evaltools-release/ComCoachAI/ /opt/comcoach/ComCoachAI/

          sudo rsync -a --delete \
            --exclude='.env' --exclude='venv/' --exclude='.venv/' \
            --exclude='__pycache__/' \
            /tmp/evaltools-release/ConvAI/ /opt/evaltools/ConvAI/

          sudo rsync -a --delete \
            --exclude='.env' --exclude='venv/' --exclude='.venv/' \
            --exclude='__pycache__/' \
            /tmp/evaltools-release/EvalAI/ /opt/evaltools/deploy-new/EvalAI/

          sudo rsync -a --delete \
            /tmp/evaltools-release/root-dist/ /opt/evaltools/deploy-new/root-dist/

          sudo rsync -a --delete \
            /tmp/evaltools-release/root-dist/ /var/www/evaltools/

          read_user_data_var() {
            sudo awk -F= -v key="$1" '
              $1 == key {
                value=$0
                sub("^[^=]*=", "", value)
                gsub(/\r/, "", value)
                sub(/^'\''/, "", value)
                sub(/'\''$/, "", value)
                print value
                exit
              }
            ' /var/lib/cloud/instance/user-data.txt
          }

          REGION="$(read_user_data_var REGION)"
          DB_PASS="$(read_user_data_var DB_PASS)"
          DB_HOST="$(read_user_data_var DB_HOST)"
          OPENAI_API_KEY_VALUE="$(read_user_data_var OPENAI_API_KEY_VALUE)"

          if [ -z "$REGION" ] || [ -z "$DB_PASS" ] || [ -z "$DB_HOST" ] || [ -z "$OPENAI_API_KEY_VALUE" ]; then
            echo "Required runtime values are missing from instance user-data."
            exit 1
          fi

          sudo tee /opt/comcoach/ComCoachAI/.env >/dev/null <<ENV
          APP_ENV=production
          DATABASE_URL=postgresql://comcoach:${DB_PASS}@${DB_HOST}:5432/comcoachai
          OPENAI_API_KEY=${OPENAI_API_KEY_VALUE}
          ADMIN_TOKEN=admin123
          HOST=0.0.0.0
          PORT=8000
          BACKEND_BASE_URL=http://127.0.0.1:8000
          FRONTEND_BASE_URL=http://127.0.0.1:3002/comcoachai
          CORS_ORIGINS=*
          AWS_REGION=${REGION}
          S3_ENABLED=true
          S3_BUCKET_NAME=comcoach-storage-585768185822-ap-south-1-20260624112658
          S3_AUDIO_PREFIX=audio
          S3_REPORT_PREFIX=reports
          COMCOACH_API_BASE_URL=/api/comcoachai
          API_BASE_URL=/api/comcoachai
          ENV

          sudo tee /opt/evaltools/ConvAI/.env >/dev/null <<ENV
          DATABASE_URL=postgresql://comcoach:${DB_PASS}@${DB_HOST}:5432/convai
          OPENAI_API_KEY=${OPENAI_API_KEY_VALUE}
          TRAINER_API_KEY=admin123
          CORS_ALLOW_ORIGINS=*
          ENV

          sudo tee /etc/systemd/system/comcoach-backend.service >/dev/null <<SERVICE
          [Unit]
          Description=ComCoach FastAPI Backend
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/opt/comcoach/ComCoachAI
          EnvironmentFile=/opt/comcoach/ComCoachAI/.env
          ExecStart=/opt/comcoach/ComCoachAI/venv/bin/uvicorn backend.main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo tee /etc/systemd/system/comcoach-frontend.service >/dev/null <<SERVICE
          [Unit]
          Description=ComCoach Next.js Frontend
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/opt/comcoach/ComCoachAI/frontend-next
          EnvironmentFile=/opt/comcoach/ComCoachAI/.env
          Environment=PORT=3002
          Environment=HOSTNAME=127.0.0.1
          ExecStart=/usr/bin/env PORT=3002 HOSTNAME=127.0.0.1 /usr/bin/npm start
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo tee /etc/systemd/system/convai-backend.service >/dev/null <<SERVICE
          [Unit]
          Description=ConvAI FastAPI Backend
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/opt/evaltools/ConvAI/backend
          EnvironmentFile=/opt/evaltools/ConvAI/.env
          ExecStart=/opt/evaltools/ConvAI/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8003
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo tee /etc/nginx/conf.d/evaltools.conf >/dev/null <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 100M;

              root /var/www/evaltools;
              index "Home page.html" index.html;

              location = /health {
                  add_header Content-Type text/plain;
                  return 200 "ok\n";
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location = /evalai {
                  add_header Content-Type text/plain;
                  return 503 "EvalAI is temporarily disabled.\n";
              }

              location /evalai/ {
                  add_header Content-Type text/plain;
                  return 503 "EvalAI is temporarily disabled.\n";
              }

              location /comcoachai {
                  proxy_pass http://127.0.0.1:3002;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-Prefix /comcoachai;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }

              location = /api/comcoachai/health {
                  proxy_pass http://127.0.0.1:8000/health;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }

              location /api/comcoachai/ {
                  proxy_pass http://127.0.0.1:8000/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:8000/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location = /convai {
                  return 308 /convai/;
              }

              location /convai/ {
                  alias /opt/evaltools/ConvAI/artifacts/interview-app/dist/;
                  try_files $uri $uri/ /convai/index.html;
              }

              location /api/convai/ {
                  proxy_pass http://127.0.0.1:8003/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-Prefix /convai;
              }
          }
          NGINX

          sudo rm -f /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/comcoach.conf

          cd /opt/comcoach/ComCoachAI
          sudo python3.11 -m venv venv
          sudo venv/bin/pip install --upgrade pip
          sudo venv/bin/pip install --no-cache-dir -r requirements.txt

          cd /opt/comcoach/ComCoachAI/frontend-next
          sudo npm ci
          sudo npm run build

          cd /opt/evaltools/ConvAI
          sudo python3.11 -m venv venv
          sudo venv/bin/pip install --upgrade pip
          sudo venv/bin/pip install --no-cache-dir -r requirements.txt

          sudo systemctl daemon-reload
          sudo systemctl enable comcoach-backend comcoach-frontend convai-backend nginx
          sudo nginx -t
          sudo systemctl restart comcoach-backend comcoach-frontend convai-backend nginx

          for attempt in $(seq 1 30); do
            if systemctl is-active --quiet nginx \
              && systemctl is-active --quiet comcoach-backend \
              && systemctl is-active --quiet comcoach-frontend \
              && systemctl is-active --quiet convai-backend \
              && curl -fsS http://127.0.0.1/health >/dev/null \
              && curl -fsS http://127.0.0.1:8000/health >/dev/null \
              && curl -fsS http://127.0.0.1:8003/api/health >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              systemctl --no-pager --full status nginx comcoach-backend comcoach-frontend convai-backend || true
              journalctl -u comcoach-backend -n 80 --no-pager -o cat || true
              journalctl -u convai-backend -n 80 --no-pager -o cat || true
              exit 1
            fi

            sleep 5
          done

          systemctl is-active nginx comcoach-backend comcoach-frontend convai-backend
          curl -fsS http://127.0.0.1/health
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8003/api/health >/dev/null

          sudo rm -rf /tmp/evaltools-release /tmp/evaltools-release.tar.gz
          REMOTE
          done

      - name: Check public load balancer
        run: |
          set -euo pipefail
          curl -fsS "http://$ALB_DNS/health"
          curl -fsS -o /dev/null "http://$ALB_DNS/"
          curl -fsS -o /dev/null "http://$ALB_DNS/comcoachai"
          curl -fsS -o /dev/null "http://$ALB_DNS/convai/"
